[project]
name = "synthsurvey"
version = "0.1.4"
description = "Simulatore di indagini su popolazione sintetica italiana"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Lorenzo Spanu" }]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "polars>=1.0",
    "pyarrow>=17",
    "httpx>=0.27",
    "numpy>=2.0",
    "jinja2>=3.1",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "pandas>=2.2",
    "openai>=1.60",
]

[project.scripts]
synthsurvey = "synthsurvey.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "pytest-asyncio>=0.24",
    "types-jsonschema>=4.23",
    "types-openpyxl>=3.1",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthsurvey"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["synthsurvey"]
mypy_path = "src"
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
