# Pilota senza API (M14): il modello è la sessione di Claude Code, che risponde
# alle richieste in attesa con `synthsurvey session answer`. Una replica, 10 persone.
# Uso: interview preview --config <questo file> --mode cawi, poi session list / answer,
# poi di nuovo interview preview, finché non resta nulla in attesa.
project:
  name: pilota-sessione
  seed: 20261105
sample:
  total: 100
  allocation: quota
  segments:
    consumer:
      share: 0.7
      source: istat_individui
      filters:
        age:
        - 18
        - 99
        region: all
      quotas:
      - sex
      - age_band
      - macro_area
      - education
      - employment
      oversample: {}
    pmi:
      share: 0.3
      source: istat_imprese
      filters:
        employees:
        - 1
        - 249
        sectors: all
      quotas:
      - size_class
      - sector
      - macro_area
      oversample:
        size_class:
          micro: 0.4
          piccola: 0.35
          media: 0.25
      respondent_role:
      - titolare
      - responsabile_acquisti
      - amministratore
questionnaire:
  path: ../../questionnaires/examples/mercato_v1.yaml
modes:
  design: within_subject
  enabled:
  - cawi
  - cati
  - capi
engine:
  models:
  - provider: session
    model: session
  effort: low
  max_tokens: 1024
  concurrency: 4
  replicates: 1
  randomize_option_order: true
  nonverbal:
    enabled: true
    vocabulary: default
run:
  pilot: false
  pilot_size: 10
  frozen: false
  budget_max_eur: 1
output:
  formats:
  - parquet
  - csv
  - sav
  dir: ../../runs
